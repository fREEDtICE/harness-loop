[project]
root_dir = ".."

[storage]
runs_dir = ".loopsmith-runs"

[workspace]
isolation = "git_worktree"

[worker]
kind = "acp"

[worker.acp]
command = ["codex"]
agent_name = "codex"
resume_sessions = true

[prompts]
discovery = "prompts/discovery.md"
planner = "prompts/planner.md"
builder = "prompts/builder.md"
evaluator = "prompts/evaluator.md"

[schemas]
workspace_profile = "schemas/workspace-profile.json"
workspace_inference = "schemas/workspace-inference.json"
planner_output = "schemas/planner-output.json"
builder_handoff = "schemas/builder-handoff.json"
qa_report = "schemas/qa-report.json"

[runtime]
feature_limit = 3
max_repair_attempts = 2
continue_after_failure = false

[runtime.supervision]
enabled = true
startup_timeout_secs = 60
readiness_poll_interval_ms = 250
shutdown_grace_period_secs = 5

[[runtime.services]]
name = "web"
start = ["pnpm", "dev"]
working_dir = "."
ready_url = "http://127.0.0.1:3000/"

[evaluator]
dimensions = ["product_depth", "correctness", "ux", "operability"]
require_screenshots = false
commands = [
  ["cargo", "test"],
  ["pnpm", "test:e2e"]
]
