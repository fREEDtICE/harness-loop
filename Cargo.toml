[workspace]
members = [
    ".",
    "crates/harness-core",
    "crates/harness-worker-codex",
    "crates/harness-worker-simulated",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[package]
name = "codex-harness-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
harness-core = { path = "crates/harness-core" }
harness-worker-codex = { path = "crates/harness-worker-codex" }
harness-worker-simulated = { path = "crates/harness-worker-simulated" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
