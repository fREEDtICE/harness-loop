[workspace]
members = [
    ".",
    "apps/harness-ui/src-tauri",
    "crates/harness-core",
    "crates/harness-ui",
    "crates/harness-worker-claude",
    "crates/harness-worker-codex",
    "crates/harness-worker-gemini",
    "crates/harness-worker-simulated",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
dirs = "6"
dialoguer = "0.11"
rusqlite = { version = "0.34", features = ["bundled"] }
walkdir = "2"

[package]
name = "loopsmith"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "loopsmith"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
tokio.workspace = true
loopsmith-core = { path = "crates/harness-core" }
loopsmith-ui = { path = "crates/harness-ui" }
loopsmith-worker-claude = { path = "crates/harness-worker-claude" }
loopsmith-worker-codex = { path = "crates/harness-worker-codex" }
loopsmith-worker-gemini = { path = "crates/harness-worker-gemini" }
loopsmith-worker-simulated = { path = "crates/harness-worker-simulated" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
